name: Community contributor CLA consent

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: cla-consent-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  scoped-cla-consent:
    name: Scoped Community CLA consent
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read trusted main-branch consent checker only
        uses: actions/checkout@v4
        with:
          repository: archahmedzaki/YourHand-Community
          ref: main
          persist-credentials: false
      - name: Verify immutable CLA and authenticated PR-author consent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/cla-gate.cjs
